# /etc/nginx/sites-available/feedback  (replace feedback.example.com with your domain)
server {
    listen 80;
    listen [::]:80;
    server_name feedback.example.com;

    root /var/www/feedback;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Allows only this site, Google Fonts, and the Apps Script backend
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://script.google.com https://script.googleusercontent.com; img-src 'self' data:; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript text/plain;

    location / {
        try_files $uri $uri/ =404;
    }

    # Dashboard: password from nginx (first lock) + ADMIN_KEY from Apps Script (second lock)
    location = /admin.html {
        auth_basic "Private";
        auth_basic_user_file /etc/nginx/.htpasswd-feedback;
    }

    location ~ /\. { deny all; }
    location ~* \.(gs|md|conf|txt)$ { return 404; }
}
