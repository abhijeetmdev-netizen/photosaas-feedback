<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>PhotoSaaS Feedback</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--bg:#f5f3f0;--surface:#fff;--ink:#141416;--mute:#6b6b70;--line:#e6e2db;--acc:#f59e0b;--acc-deep:#b45309;--acc-soft:#fff3d9;--acc-ink:#1a1204;--star:#f59e0b;--side:#0b0b0c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 Inter,"Noto Sans Devanagari",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1{margin:0;font-weight:700;line-height:1.35;text-wrap:balance}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.star-svg{fill:currentColor}

.top{max-width:1120px;margin:0 auto;padding:40px 22px 0;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.top h1{font-size:clamp(26px,4vw,34px)}.top p{margin:4px 0 0;color:var(--mute)}
main{max-width:1120px;margin:0 auto;padding:26px 22px 60px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}
.stat{padding:20px 24px;border-right:1px solid var(--line)}.stat:last-child{border:0}
.stat b{display:block;font-size:32px;line-height:1.3;font-weight:700;font-variant-numeric:tabular-nums}.stat span{color:var(--mute);font-size:14px}
.tools{display:flex;gap:10px;margin:26px 0 14px;flex-wrap:wrap}
.find{position:relative;flex:1;min-width:220px}.find svg{position:absolute;left:14px;top:50%;width:18px;height:18px;transform:translateY(-50%);stroke:var(--mute);fill:none;stroke-width:2;stroke-linecap:round}
.find input{width:100%;height:46px;padding:0 16px 0 42px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit}
.find input:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.btn{height:46px;padding:0 20px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600}
.btn.p{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}.btn:hover{opacity:.9}
#status{color:var(--mute);margin:0 0 10px}
.wrap{background:var(--surface);overflow-x:auto;border:1px solid var(--line);border-radius:16px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:1500px}
th,td{padding:14px 16px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:#faf8f5;color:var(--mute);font-weight:600;font-size:13px;white-space:nowrap}
tbody tr:last-child td{border:0}tbody tr:hover td{background:#faf8f5}
.rt{display:inline-flex;gap:2px}.rt svg{width:15px;height:15px;fill:#ddd7cd}.rt svg.on{fill:var(--star)}
.sug{max-width:320px}.dt{white-space:nowrap;color:var(--mute)}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--acc-soft);color:var(--acc-deep);font-size:13px;font-weight:600;white-space:nowrap}
.empty{text-align:center;color:var(--mute);padding:40px}
.hd{background:var(--side);color:#f2f2f3;padding:18px 22px}.hd .lock{max-width:1120px;margin:auto}.lock{display:flex;gap:12px;align-items:center}.tile{flex:none;width:44px;height:44px;border-radius:12px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center}.lock b{display:block;font-size:17px;line-height:1.35}.lock span{font-size:13px;color:#8e8e94}</style></head><body>
<header class="hd"><div class="lock"><div class="tile"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg></div><div><b>PhotoSaaS</b><span>Customer feedback dashboard</span></div></div></header>
<main><div class="stats">
<div class="stat"><b id="total">0</b><span>एकूण feedback</span></div><div class="stat"><b id="avg">0</b><span>सरासरी Rating (5 पैकी)</span></div>
<div class="stat"><b id="useful">0%</b><span>उपयोगी वाटले</span></div><div class="stat"><b id="interested">0</b><span>Contact हवा आहे</span></div></div>
<div class="tools"><div class="find"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="नंबर, email किंवा suggestion शोधा" oninput="render()"></div><button class="btn" onclick="load()">Refresh</button><button class="btn p" onclick="exportCSV()">CSV download</button></div>
<p id="status" role="status"></p>
<div class="wrap"><table><thead><tr><th>Date</th><th>Rating</th><th>Useful</th><th>Modules</th><th>Time saved</th><th>Cost</th><th>Reuse</th><th>Recommend</th><th>Interest</th><th>Phone</th><th>Email</th><th>Suggestion</th><th>Consent</th></tr></thead><tbody id="tb"></tbody></table></div></main>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbzorRPSYF7ZBO_SG2SplaD7s9Npki0orslQvcLglBmoUkvQxJALa-rivAHV8FPzIcBWxg/exec", QKEY="abhijeet_983434", SP="M12 2.5l2.9 6.1 6.6.9-4.8 4.6 1.2 6.6L12 17.5l-5.9 3.2 1.2-6.6L2.5 9.5l6.6-.9z"; let rows=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const stars=n=>{n=Number(n)||0;return `<span class="rt" title="${n}/5">`+[1,2,3,4,5].map(i=>`<svg viewBox="0 0 24 24" class="${i<=n?"on":""}"><path d="${SP}"/></svg>`).join("")+"</span>"};
const fmt=t=>{const d=new Date(t);return isNaN(d)?esc(t):d.toLocaleString("en-IN",{dateStyle:"medium",timeStyle:"short"})};
async function load(){
 const st=$("status"); st.textContent="";
 if(API_URL.startsWith("PASTE_")){try{rows=JSON.parse(localStorage.getItem(QKEY)||"[]")}catch(e){rows=[]}}
 else{
  const key=sessionStorage.getItem("adminKey")||prompt("Admin key:"); if(!key) return;
  try{const r=await fetch(API_URL+"?action=list&key="+encodeURIComponent(key)); const j=await r.json();
   if(j.error){sessionStorage.removeItem("adminKey");st.textContent="Admin key चुकीची आहे. Refresh दाबून पुन्हा टाका.";return;}
   sessionStorage.setItem("adminKey",key); rows=j;}catch(e){st.textContent="Data load झाला नाही. Internet / Apps Script URL तपासा.";return;}
 }
 rows.sort((a,b)=>String(b.timestamp).localeCompare(String(a.timestamp))); render();
}
function render(){
 $("total").textContent=rows.length;
 $("avg").textContent=rows.length?(rows.reduce((a,b)=>a+Number(b.rating||0),0)/rows.length).toFixed(1):"0";
 $("useful").textContent=rows.length?Math.round(rows.filter(x=>x.useful==="अत्यंत उपयोगी"||x.useful==="उपयोगी").length/rows.length*100)+"%":"0%";
 $("interested").textContent=rows.filter(x=>(x.interest||"").includes("Contact")).length;
 const q=$("q").value.trim().toLowerCase(), v=rows.filter(x=>!q||JSON.stringify(x).toLowerCase().includes(q));
 $("tb").innerHTML=v.length?v.map(x=>`<tr><td class="dt">${fmt(x.timestamp)}</td><td>${stars(x.rating)}</td><td>${esc(x.useful)}</td><td class="sug">${esc(x.features)}</td><td>${esc(x.time_saved)}</td><td>${esc(x.cost)}</td><td>${esc(x.reuse)}</td><td>${esc(x.recommend)}</td><td>${x.interest?`<span class="chip">${esc(x.interest)}</span>`:""}</td><td>${esc(x.phone)}</td><td>${esc(x.email)}</td><td class="sug">${esc(x.suggestion)}</td><td>${esc(x.consent)}</td></tr>`).join(""):`<tr><td class="empty" colspan="13">${rows.length?"Search ला काही सापडले नाही.":"अजून feedback आलेला नाही. Customer page share करा."}</td></tr>`;
}
function exportCSV(){
 const h=["Date","Rating","Useful","Features","Time Saved","Cost","Reuse","Recommend","Interest","Phone","Email","Suggestion","Consent"];
 const cell=v=>{v=String(v??"");if(/^[=+\-@]/.test(v))v="'"+v;return `"${v.replaceAll('"','""')}"`};
 const csv=[h,...rows.map(x=>[x.timestamp,x.rating,x.useful,x.features,x.time_saved,x.cost,x.reuse,x.recommend,x.interest,x.phone,x.email,x.suggestion,x.consent])].map(r=>r.map(cell).join(",")).join("\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv"}));a.download="photo-feedback.csv";a.click();
}
load();
</script></body></html>
